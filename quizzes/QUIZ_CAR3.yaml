title: Introduction to Genomic Counselling and Genomics Careers
resource_text: '### Exploring Careers in Genomic Counselling and Genomics


  Genomics is the study of genes and how alterations in them can affect how proteins
  are produced or function within the body. Genes act as instructions for the body
  to grow and survive. DNA, the hereditary material found in nearly every cell, is
  the focus of this field. Healthcare scientists in genomics examine DNA or RNA samples
  to identify alterations responsible for inherited or acquired conditions, such as
  cancer or cystic fibrosis.


  #### The Role of a Genomic Counsellor

  Genomic counsellors are highly skilled professionals who combine training in genetics
  with excellent communication and counselling skills. They work directly with patients
  and their families to provide support and information, helping them adapt to genetic
  diseases. A typical day for a genomic counsellor involves recording medical histories,
  ordering and interpreting genetic tests, and assessing the risk of inheriting or
  passing on medical conditions. They also translate complex test results for patients
  and other healthcare professionals, and provide emotional support to families facing
  life-changing news.


  #### The Role of a Genomics Healthcare Scientist

  Unlike genomic counsellors, healthcare scientists working in genomics rarely have
  direct patient contact. Their work is primarily laboratory-based, involving the
  chemical examination of cellular DNA. Their responsibilities include prenatal diagnosis,
  carrier testing, and confirming diagnoses for inherited and acquired conditions.
  They work within multidisciplinary teams alongside doctors, specialist nurses, and
  genomic counsellors.


  #### Career Progression and Pay

  Most roles in the NHS are covered by the ''Agenda for Change'' (AfC) pay system,
  which consists of nine pay bands. Salaries vary significantly based on the specific
  role and level of responsibility. For example, a Genetic Counsellor role in Cambridge
  is listed with a salary range of £49,387 to £56,515, while a Clinical Genomics Consultant
  in London can earn between £94,356 and £150,569. Trainee roles, such as a Genetic
  Technologist, may start between £32,073 and £39,043. As staff gain experience and
  further qualifications, they can progress to more senior bands, with clinical scientists
  generally starting at band 7 and potentially reaching band 9.


  #### Entry Requirements

  There are multiple pathways into these careers. For entry-level positions or apprenticeships,
  candidates typically need GCSEs (grades 9-4/A-C) in maths, English, and science.
  A level 6 apprenticeship or degree requires relevant level 3 qualifications, such
  as A-levels including a science subject. To become a clinical scientist, one must
  complete the NHS Scientist Training Programme (STP), which requires a 1st or 2:1
  degree in a relevant subject. Because these programmes are highly competitive, gaining
  relevant experience through volunteering or working in a related environment is
  highly recommended.


  #### Skills and Benefits

  Success in these fields requires excellent communication, emotional resilience,
  problem-solving abilities, and strong organisational skills. Working in the NHS
  offers numerous benefits, including flexible working, high income potential early
  in a career, an excellent pension scheme, and good holiday entitlement. Whether
  working directly with patients as a counsellor or behind the scenes as a scientist,
  these professionals play a vital role in healthcare, often working at the forefront
  of research and innovation, such as the Human Genome Project.


  ### References

  reference 1: https://www.healthcareers.nhs.uk/explore-roles/healthcare-science/roles-healthcare-science/life-sciences/genomic-counselling

  reference 2: https://www.healthcareers.nhs.uk/Explore-roles/healthcare-science/roles-healthcare-science/life-sciences/genomics

  reference 3: https://www.healthcareers.nhs.uk/working-health/working-nhs/nhs-pay-and-benefits/agenda-change-pay-rates

  '
