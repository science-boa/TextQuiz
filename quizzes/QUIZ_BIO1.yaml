- question_num: 1
  text: What is the maximum magnification of a light microscope?
  A: ×275
  B: ×1000
  C: ×1500
  D: ×1,000,000
  answer: C
  points: 1
  explanation: The text states the maximum magnification with a light microscope is
    around ×1500.
- question_num: 2
  text: What is the resolution of a light microscope?
  A: 0.2 μm
  B: 1 nm
  C: 200 μm
  D: 1000 nm
  answer: A
  points: 1
  explanation: The text states the resolution of a light microscope is around 0.2
    μm, or 200 nm.
- question_num: 3
  text: Which microscope is best for examining the surface structure of specimens?
  A: Compound microscope
  B: Transmission electron microscope
  C: Scanning electron microscope
  D: Light microscope
  answer: C
  points: 1
  explanation: The text states the scanning electron microscope (SEM) has a large
    field of view and is used to examine the surface structure of specimens.
- question_num: 4
  text: What does a compound microscope use to magnify images?
  A: A single spherical lens
  B: A beam of electrons
  C: An objective lens and an eyepiece
  D: A digital sensor
  answer: C
  points: 1
  explanation: 'The text defines a compound microscope as one that uses two lenses:
    the objective lens and the eyepiece.'
- question_num: 5
  text: What is the definition of resolution?
  A: The ability to make an image larger
  B: The ability to see two points as two points rather than merged
  C: The area seen when looking through a microscope
  D: The brightness of the illumination
  answer: B
  points: 1
  explanation: The text defines resolution as the ability to see two points as two
    points, rather than merged into one.
- question_num: 6
  text: How is a nanometre written in standard form?
  A: 1 × 10^-6 m
  B: 1 × 10^-3 m
  C: 1 × 10^-9 m
  D: 1 × 10^-12 m
  answer: C
  points: 1
  explanation: The text states one nanometre is 1 × 10^-9 m.
- question_num: 7
  text: Which microscope is used to examine thin slices of cells or tissue?
  A: Scanning electron microscope
  B: Transmission electron microscope
  C: Light microscope
  D: Spherical lens microscope
  answer: B
  points: 1
  explanation: The text states the transmission electron microscope (TEM) is used
    to examine thin slices or sections of cells or tissue.
- question_num: 8
  text: Who constructed a microscope with a single spherical lens in the late 1600s?
  A: Robert Hooke
  B: The Janssens
  C: Antonie van Leeuwenhoek
  D: AQA
  answer: C
  points: 1
  explanation: The text identifies Antonie van Leeuwenhoek as the scientist who constructed
    a microscope with a single spherical lens.
- question_num: 9
  text: What is the maximum magnification of a transmission electron microscope?
  A: ×1500
  B: ×275
  C: ×100,000
  D: ×1,000,000
  answer: D
  points: 1
  explanation: The text states TEMs have a maximum magnification of around ×1,000,000.
long_answer:
  question_num: 1
  text: Compare and contrast the light microscope and the transmission electron microscope
    (TEM) in terms of their magnification, resolution, and primary uses.
  points: 6
  rubric: The answer should mention that light microscopes have a maximum magnification
    of ×1500 and a resolution of 200 nm, whereas TEMs have a magnification of ×1,000,000
    and a resolution of less than 1 nm. It should note that light microscopes use
    light rays while TEMs use electron beams, and that TEMs are used for thin slices
    of cells/tissue while light microscopes are used for general cell observation.
