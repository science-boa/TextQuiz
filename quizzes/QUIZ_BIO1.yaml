title: The Science of Microscopy and Cell Observation
resource_text: '# Understanding Cells and Microscopy


  ## The Nature of Organisms

  All living organisms are composed of cells. In most cases, these organisms are multicellular,
  meaning they are made up of many cells. These cells are often specialised, which
  means they have evolved or adapted to perform a particular job within the organism.
  Because cells are generally very small, scientists require specialised equipment,
  specifically microscopes, to study them in sufficient detail.


  ## The History of the Microscope

  While the exact identity of the person who first invented the microscope remains
  unknown, the development of this tool has followed several key historical stages.
  In the 1590s, Dutch spectacle makers, the Janssen family, experimented with placing
  lenses into tubes. This led to the creation of the first compound microscope. A
  compound microscope is defined by its use of two lenses: an objective lens and an
  eyepiece. The objective lens, which has a very short focal length, creates a greatly
  magnified image, which is then magnified further by the eyepiece. Although none
  of the original Janssen microscopes have survived, it is estimated that they provided
  magnification between ×3 and ×9.


  In 1650, the British scientist Robert Hooke, who is also renowned for his work on
  the law of elasticity in physics, used a compound microscope to observe and draw
  cells. Later, in the late 1600s, the Dutch scientist Antonie van Leeuwenhoek constructed
  a microscope using a single spherical lens. This device was significantly more powerful,
  capable of magnifying objects up to ×275. By the 1800s, the optical quality of lenses
  had improved drastically, leading to the development of microscopes that are similar
  in design to those used in modern laboratories today. Throughout this history, the
  magnification of light microscopes has steadily increased, though there is a physical
  limit to this technology, with modern light microscopes reaching a maximum magnification
  of approximately ×1500.


  ## Resolution and Detail

  Magnification is not the only important factor when viewing cells; the level of
  detail visible is equally critical. This detail is determined by the resolution,
  or resolving power, of the microscope. Resolution is defined as the ability to distinguish
  two separate points as distinct entities rather than seeing them merged into one.
  If a digital photograph is enlarged beyond a certain point, it becomes blurry because
  the resolution is insufficient to show more detail; the same principle applies to
  microscopy.


  Light microscopes have a resolution of approximately 0.2 micrometres (μm), or 200
  nanometres (nm). This means they cannot distinguish between two points that are
  closer together than 200 nm. A nanometre is one billionth of a metre, expressed
  as 1 × 10^-9 metres.


  ## Electron Microscopy

  To see structures that are invisible to light microscopes, scientists use electron
  microscopes, which employ a beam of electrons instead of light rays. There are two
  primary types:

  1. The Scanning Electron Microscope (SEM): This type has a large field of view,
  making it ideal for examining the surface structure of specimens. SEMs are typically
  used at lower magnifications.

  2. The Transmission Electron Microscope (TEM): This is used to examine thin slices
  or sections of cells or tissue. TEMs offer a maximum magnification of around ×1,000,000,
  and images can be further enlarged photographically. The limit of resolution for
  a TEM is now less than 1 nm, allowing for the observation of cellular structures
  that light microscopes cannot detect.


  ## Investigating Cells with a Light Microscope

  When using a light microscope, specific procedures must be followed. When first
  examining a slide, one should rotate the objective lenses so that the low-power
  lens (e.g., ×10) is in line with the stage. Safety is paramount: users must be careful
  with bright illumination, handle microscope stains with caution, and be mindful
  when using coverslips and slides.


  Recording observations is a vital part of the process. This can be done through
  labelled diagrams or digital images. When using low power, a diagram should be drawn
  to act as a plan, showing the arrangement of distinct regions of tissue or the outlines
  of individual cells. A high-power diagram should then be produced to show a detailed
  image of a specific part of the slide, such as a single cheek or onion cell.'
